##### General #####

# Use | and - to split panes
bind | split-window -h
bind - split-window -v
bind _ split-window -v

unbind '"'
unbind %

# Use Alt + Arrow keys to switch panes without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift + Arrow keys to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Window & pane indexing start at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatic window renaming & title support
set -g automatic-rename on
set -g set-titles on

# Notifications & key mode
setw -g monitor-activity on
setw -g mode-keys vi


##### Pane Resizing #####

# Resize panes with Shift + vim keys (fast)
bind J resize-pane -D 5
bind K resize-pane -U 5
bind H resize-pane -L 5
bind L resize-pane -R 5

# Resize panes with Alt + vim keys (slow/precise)
bind M-j resize-pane -D 1
bind M-k resize-pane -U 1
bind M-h resize-pane -L 1
bind M-l resize-pane -R 1


##### Mouse #####
set -g mouse on


##### Status Bar Theme #####

set -g status-bg black
set -g status-fg white

set -g window-status-current-style "bg=white,fg=black,bold"

set -g status-interval 60
set -g status-left-length 30

set -g status-left  '#[fg=green](#hoami) '
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg) #[fg=white]%H:%M'


##### Pane from another session/window #####

bind-key @ command-prompt -p "create pane from:" \
    "join-pane -h -s ':%%'"
